<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nginx Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#2563eb,#06b6d4);color:white;
display:flex;align-items:center;justify-content:center}.container{width:90%;max-width:900px}
.hero{background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2);
border-radius:24px;padding:50px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.logo{font-size:64px;margin-bottom:10px}h1{margin:0;font-size:48px}.subtitle{font-size:20px;opacity:.9;margin:15px 0 35px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:rgba(255,255,255,.15);border-radius:16px;padding:25px 15px}
.card h3{margin:10px 0}.card p{margin:0;opacity:.85}.badge{display:inline-block;margin-top:35px;padding:10px 20px;
border-radius:999px;background:#22c55e;color:#052e16;font-weight:bold}
@media(max-width:650px){h1{font-size:36px}.hero{padding:30px 20px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container"><div class="hero">
<div class="logo">🚀</div><h1>Nginx Demo</h1>
<div class="subtitle">Your web server is up and running!</div>
<div class="cards">
<div class="card"><div style="font-size:32px">🌐</div><h3>Web Server</h3><p>Nginx is serving this page.</p></div>
<div class="card"><div style="font-size:32px">🐳</div><h3>Container</h3><p>Running inside Docker.</p></div>
<div class="card"><div style="font-size:32px">💾</div><h3>Storage</h3><p>Perfect for mount demos.</p></div>
</div>
<div class="badge">✓ NGINX ONLINE</div>
</div></div>
</body></html>
